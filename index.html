<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Registre opératoire</title>
  <meta name="description" content="Mon registre de patients opérés pendant l'internat.">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Registre">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1 id="title">Patients</h1>
    <div class="topbar-right">
      <span class="counter" id="counter" title="Nombre total de patients opérés">0 patient</span>
      <button class="icon-btn" id="btn-settings" aria-label="Réglages"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
    </div>
  </header>

  <main id="view"></main>

  <nav class="tabbar">
    <button data-tab="patients" class="active"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c1.4-3.8 4.2-5.6 7.5-5.6s6.1 1.8 7.5 5.6"/></svg>Patients</button>
    <button data-tab="fiches"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h6.5L18 8v12.5H7z"/><path d="M13.5 3.5V8H18M10 12.5h5M10 16.5h5"/></svg>Fiches</button>
    <button data-tab="voies"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 20.5l8-8"/><path d="M11.5 12.5l6.6-6.6a2.5 2.5 0 0 1 0 3.6l-5 5z"/></svg>Voies</button>
    <button data-tab="classif"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"/></svg>Classif.</button>
    <button data-tab="stats"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 20v-8M12 20V5M18.5 20v-5"/></svg>Stats</button>
  </nav>

  <div class="sheet-backdrop" id="sheet" hidden>
    <div class="sheet" id="sheet-body" role="dialog" aria-modal="true"></div>
  </div>

  <script src="fiches.js"></script>
  <script src="voies.js"></script>
  <script src="classifications.js"></script>
  <script src="app.js"></script>
</body>
</html>
