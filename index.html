<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Registre opératoire</title>
  <meta name="description" content="Mon registre de patients opérés pendant l'internat.">
  <meta name="theme-color" content="#3d9be9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Registre">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1 id="title">Patients</h1>
    <div class="topbar-right">
      <span class="counter" id="counter" title="Nombre total de patients opérés">0 patient</span>
      <button class="icon-btn" id="btn-settings" aria-label="Réglages">⚙︎</button>
    </div>
  </header>

  <main id="view"></main>

  <nav class="tabbar">
    <button data-tab="patients" class="active"><span>🩺</span>Patients</button>
    <button data-tab="stats"><span>📊</span>Statistiques</button>
    <button data-tab="fiches"><span>📋</span>Fiches</button>
  </nav>

  <div class="sheet-backdrop" id="sheet" hidden>
    <div class="sheet" id="sheet-body" role="dialog" aria-modal="true"></div>
  </div>

  <script src="fiches.js"></script>
  <script src="app.js"></script>
</body>
</html>
